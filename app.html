<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d1b35"><title>Elite Shoes</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}header{background:#0d1b35;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}nav{background:#fff;padding:9px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #ddd}button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer}.active,.primary{background:#4778ff;color:white}.wrap{max-width:1200px;margin:auto;padding:18px}.page{display:none}.on{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #e4e8ef;border-radius:12px;padding:16px;margin-bottom:14px}.muted{color:#77839a}.toolbar,.row{display:flex;gap:8px;margin:10px 0}.toolbar input{flex:1}input,select{padding:10px;border:1px solid #dce1ea;border-radius:8px;width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f5}.ok{color:#15965d;font-weight:bold}.low{color:#d48400;font-weight:bold}.out{color:#d33;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}.box{background:white;width:min(720px,94vw);max-height:90vh;overflow:auto;padding:20px;border-radius:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.right{text-align:right}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><header><b id="brand">ES ELITE SHOES</b><button onclick="updateCheck()">🔄 Check Update</button></header><nav><button class="active" onclick="page('home',this)">Dashboard</button><button onclick="page('stock',this)">Stock</button><button onclick="page('sales',this)">Invoices</button><button onclick="page('settings',this)">Settings</button></nav><main class="wrap"><section id="home" class="page on"><h1>Dashboard</h1><div class="grid"><div class="card">Sales<h2 id="sales">₹0</h2></div><div class="card">Invoices<h2 id="inv">0</h2></div><div class="card">Stock<h2 id="stockN">0</h2></div><div class="card">Low Stock<h2 id="lowN">0</h2></div></div><button class="primary" onclick="newInvoice()">＋ New Invoice</button> <button onclick="editProduct()">＋ Add Product</button></section><section id="stock" class="page"><h1>Products & Stock</h1><div class="card"><div class="toolbar"><input id="search" placeholder="Search product / SKU / brand" oninput="renderStock()"><button class="primary" onclick="editProduct()">＋ Add Product</button></div><div id="stockTable"></div></div></section><section id="sales" class="page"><h1>Sales & Invoices</h1><div class="card"><button class="primary" onclick="newInvoice()">＋ New Invoice</button><div id="salesTable"></div></div></section><section id="settings" class="page"><h1>Settings</h1><div class="card"><div class="form"><label>Shop Name<input id="shop"></label><label>Phone<input id="phone"></label><label class="full">Address<input id="address"></label><label>GSTIN<input id="gst"></label><label>Invoice Prefix<input id="prefix"></label></div><br><button class="primary" onclick="saveSettings()">Save Settings</button><hr><p>App version: <b>1.0.0</b></p><button onclick="updateCheck()">🔄 Check for Update</button></div></section></main><div id="pm" class="modal"><div class="box"><h2 id="pt">Add Product</h2><form id="pf"><input type="hidden" name="id"><div class="form"><label>Name<input name="name" required></label><label>SKU/Barcode<input name="sku"></label><label>Brand<input name="brand"></label><label>Category<input name="cat"></label><label>Size<input name="size"></label><label>Stock<input name="qty" type="number" min="0" value="0"></label><label>Purchase Price<input name="cost" type="number" min="0" value="0"></label><label>Selling Price<input name="price" type="number" min="0" value="0"></label></div><br><button class="primary">Save</button> <button type="button" onclick="closeM('pm')">Cancel</button></form></div></div><div id="im" class="modal"><div class="box"><h2>New Invoice</h2><div class="row"><input id="customer" value="Walk-in Customer"><select id="pay"><option>Paid</option><option>Unpaid</option><option>Partial</option></select></div><div class="row"><select id="prod" onchange="stockHint()"></select><input id="qty" type="number" min="1" value="1"><button class="primary" onclick="addItem()">＋ Add</button></div><div id="hint" class="muted"></div><div id="items"></div><div class="row"><label>Discount %<input id="discount" type="number" min="0" max="100" value="0" oninput="renderItems()"></label><h3 class="right" id="total">₹0</h3></div><button class="primary" onclick="saveInvoice()">Create Invoice</button> <button onclick="closeM('im')">Cancel</button></div></div><div id="um" class="modal"><div class="box"><h2>🆕 Update available</h2><p id="ut"></p><button class="primary" onclick="location.reload(true)">Update Now</button><button onclick="closeM('um')">Later</button></div></div><script>const VER='1.0.0',KEY='elite_shoes';let d=JSON.parse(localStorage.getItem(KEY)||'null')||{shop:'Elite Shoes',phone:'',address:'',gst:'',prefix:'INV',products:[],invoices:[]},items=[];const $=x=>document.getElementById(x),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function openM(id){$(id).classList.add('on')}function closeM(id){$(id).classList.remove('on')}function editProduct(p){$('pf').reset();$('pt').textContent=p?'Edit Product':'Add Product';if(p)Object.keys(p).forEach(k=>{if($('pf').elements[k])$('pf').elements[k].value=p[k]});openM('pm')}$('pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:f.get('id')?+f.get('id'):Date.now(),name:f.get('name'),sku:f.get('sku'),brand:f.get('brand'),cat:f.get('cat'),size:f.get('size'),qty:+f.get('qty'),cost:+f.get('cost'),price:+f.get('price')},i=d.products.findIndex(x=>x.id===o.id);i<0?d.products.push(o):d.products[i]=o;closeM('pm');save()};function renderStock(){let q=($('search')?.value||'').toLowerCase(),a=d.products.filter(p=>(p.name+' '+p.sku+' '+p.brand).toLowerCase().includes(q));$('stockTable').innerHTML=a.length?'<table><tr><th>Product</th><th>SKU</th><th>Size</th><th>Stock</th><th>Sale</th><th></th></tr>'+a.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><small>'+esc(p.brand)+'</small></td><td>'+esc(p.sku)+'</td><td>'+esc(p.size)+'</td><td class="'+(p.qty<=0?'out':p.qty<=5?'low':'ok')+'">'+p.qty+(p.qty<=5?' ⚠️':'')+'</td><td>'+money(p.price)+'</td><td><button onclick="editProduct(d.products.find(x=>x.id=='+p.id+'))">Edit</button></td></tr>').join('')+'</table>':'<p class="muted">No products yet.</p>'}function newInvoice(){items=[];$('customer').value='Walk-in Customer';$('discount').value=0;fillProd();renderItems();openM('im')}function fillProd(){$('prod').innerHTML=d.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' | Size '+esc(p.size)+' | Stock: '+p.qty+' | '+money(p.price)+'</option>').join('')||'<option value="">Add products first</option>';stockHint()}function stockHint(){let p=d.products.find(x=>x.id==+$('prod').value);$('hint').textContent=p?'Available stock: '+p.qty+(p.qty<=5?' — LOW STOCK ⚠️':''):''}function addItem(){let p=d.products.find(x=>x.id==+$('prod').value),q=+$('qty').value;if(!p)return;let used=items.filter(x=>x.id===p.id).reduce((a,x)=>a+x.qty,0);if(q+used>p.qty)return alert('Only '+Math.max(0,p.qty-used)+' available');items.push({id:p.id,name:p.name,qty:q,price:p.price});renderItems()}function renderItems(){let sub=items.reduce((a,x)=>a+x.qty*x.price,0),pct=Math.min(100,Math.max(0,+$('discount').value||0)),tot=sub*(1-pct/100);$('items').innerHTML=items.length?'<table><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr>'+items.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td><td><button onclick="items.splice('+i+',1);renderItems()">×</button></td></tr>').join('')+'</table><p>Subtotal '+money(sub)+' · Discount '+pct+'% · Total '+money(tot)+'</p>':'<p class="muted">No products added.</p>';$('total').textContent=money(tot)}function saveInvoice(){if(!items.length)return alert('Add products first');for(let x of items){let p=d.products.find(p=>p.id===x.id);if(!p||p.qty<x.qty)return alert('Stock changed. Check stock again.')}let sub=items.reduce((a,x)=>a+x.qty*x.price,0),pct=+$('discount').value||0;items.forEach(x=>d.products.find(p=>p.id===x.id).qty-=x.qty);d.invoices.unshift({no:(d.prefix||'INV')+'-'+Date.now().toString().slice(-6),date:new Date().toLocaleDateString('en-IN'),customer:$('customer').value,payment:$('pay').value,discount:pct,total:sub*(1-pct/100),items:[...items]});closeM('im');save();alert('Invoice created')}function render(){let s=d.invoices.reduce((a,x)=>a+x.total,0),n=d.products.reduce((a,x)=>a+x.qty,0);$('sales').textContent=money(s);$('inv').textContent=d.invoices.length;$('stockN').textContent=n;$('lowN').textContent=d.products.filter(x=>x.qty<=5).length;$('shop').value=d.shop;$('phone').value=d.phone;$('address').value=d.address;$('gst').value=d.gst;$('prefix').value=d.prefix;$('brand').textContent=(d.shop||'Elite Shoes').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()+' '+(d.shop||'Elite Shoes').toUpperCase();renderStock();$('salesTable').innerHTML=d.invoices.length?'<table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th></tr>'+d.invoices.map(i=>'<tr><td>'+i.no+'</td><td>'+i.date+'</td><td>'+esc(i.customer)+'</td><td>'+i.items.length+'</td><td>'+money(i.total)+'</td></tr>').join('')+'</table>':'<p class="muted">No invoices.</p>'}function saveSettings(){d.shop=$('shop').value.trim()||'Elite Shoes';d.phone=$('phone').value;d.address=$('address').value;d.gst=$('gst').value;d.prefix=$('prefix').value||'INV';save();alert('Settings saved')}async function updateCheck(){try{let r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}),v=await r.json();if(v.version!==VER){$('ut').textContent='Version '+v.version+' is available. Your shop data stays in this browser.';openM('um')}else alert('You are up to date.')}catch(e){alert('Update check failed. Please use the online app.')}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
