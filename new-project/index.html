<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Elite Shoes Manager</title><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#111827}.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:white;padding:22px 14px;position:fixed;height:100vh}.brand{font-size:21px;font-weight:800;padding:0 10px 24px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;padding:11px;border-radius:9px;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1f2937;color:white}.main{margin-left:230px;padding:28px;width:calc(100% - 230px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:15px;padding:20px}.value{font-size:28px;font-weight:800}.label{color:#64748b;font-size:13px}.panel{margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 15px;background:#111827;color:white;cursor:pointer}.blue{background:#2563eb}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 8px;border-radius:99px;background:#ecfdf5;color:#047857}.low{background:#fef2f2;color:#b91c1c}.search,input,select{padding:10px;border:1px solid #ddd;border-radius:8px}.search{width:100%;margin-bottom:12px}.empty{text-align:center;color:#64748b;padding:30px}@media(max-width:800px){.side{width:70px}.brand{font-size:0}.brand:after{content:'ES';font-size:20px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:15px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.cards{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Elite Shoes</div><nav class="nav"><button data-page="dashboard">⌂ Dashboard</button><button data-page="products">◈ Products</button><button data-page="stock">▣ Stock</button><button data-page="sales">₹ Sales</button><button data-page="invoices">▤ Invoices</button><button data-page="purchases">＋ Purchases</button><button data-page="returns">↩ Returns</button><button data-page="customers">♙ Customers</button><button data-page="expenses">− Expenses</button><button data-page="reports">▥ Reports</button><button data-page="settings">⚙ Settings</button></nav></aside><main class="main" id="app"></main></div><script>const K='elite_manager_v2';let d=JSON.parse(localStorage.getItem(K)||'null')||{products:[],sales:[],customers:[],expenses:[],purchases:[],returns:[]};const save=()=>localStorage.setItem(K,JSON.stringify(d)),money=n=>'₹'+(+n||0).toLocaleString('en-IN'),pairs=()=>d.products.reduce((a,p)=>a+(+p.qty||0),0),saleTotal=()=>d.sales.reduce((a,s)=>a+(+s.total||0),0);function render(page='dashboard'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let a=document.getElementById('app');if(page==='dashboard')a.innerHTML=`<div class="top"><div><h1>Dashboard</h1><p>Your new shop management system.</p></div><button class="btn blue" onclick="render('sales')">＋ New Sale</button></div><div class="cards"><div class="card"><div class="label">Today's Sales</div><div class="value">${money(saleTotal())}</div></div><div class="card"><div class="label">Stock Pairs</div><div class="value">${pairs()}</div></div><div class="card"><div class="label">Low Stock</div><div class="value">${d.products.filter(p=>(+p.qty||0)<=3).length}</div></div><div class="card"><div class="label">Customers</div><div class="value">${d.customers.length}</div></div></div><div class="panel"><h2>Quick Start</h2><p>Add products first, then create a multi-product invoice from Sales.</p></div>`;else if(page==='products'||page==='stock')products(a);else if(page==='sales'||page==='invoices')sales(a);else if(page==='customers')customers(a);else if(page==='expenses')expenses(a);else if(page==='reports')reports(a);else a.innerHTML=`<div class="top"><h1>${page[0].toUpperCase()+page.slice(1)}</h1></div><div class="panel empty">This module is ready for the next build phase.</div>`}function products(a){a.innerHTML=`<div class="top"><div><h1>Products & Stock</h1><p>Men · Women · Kids · Unisex</p></div><button class="btn blue" onclick="addProduct()">＋ Add Product</button></div><div class="panel"><input class="search" placeholder="Search products..." oninput="list(this.value)"><div id="list"></div></div>`;list('')}function list(q){let x=d.products.filter(p=>(p.name+' '+p.category+' '+p.sku).toLowerCase().includes(q.toLowerCase()));document.getElementById('list').innerHTML=x.length?`<table class="table"><tr><th>Product</th><th>Category</th><th>Size</th><th>Stock</th><th>Price</th><th></th></tr>${x.map(p=>`<tr><td>${p.name}<br><small>${p.sku}</small></td><td>${p.category}</td><td>${p.size||'-'}</td><td><span class="badge ${p.qty<=3?'low':''}">${p.qty} pairs</span></td><td>${money(p.price)}</td><td><button class="btn" onclick="editProduct('${p.id}')">Edit</button></td></tr>`).join('')}</table>`:'<div class="empty">No products yet.</div>'}function addProduct(id){let p=id?d.products.find(x=>x.id==id):null,name=prompt('Product name',p?.name||'');if(!name)return;let category=prompt('Category: Men / Women / Kids / Unisex',p?.category||'Unisex')||'Unisex',size=prompt('Size',p?.size||''),qty=+prompt('Stock pairs',p?.qty||0),price=+prompt('Sale price ₹',p?.price||0);if(p)Object.assign(p,{name,category,size,qty,price});else d.products.push({id:Date.now(),name,category,size,qty,price,sku:'ES-'+String(Date.now()).slice(-6)});save();render('products')}function editProduct(id){addProduct(id)}let cart=[];function sales(a){cart=[];a.innerHTML=`<div class="top"><h1>New Invoice</h1></div><div class="panel"><input id="cust" placeholder="Customer name"><br><br><select id="sp"><option value="">Select product</option>${d.products.filter(p=>p.qty>0).map(p=>`<option value="${p.id}">${p.name} — ${p.qty} left — ${money(p.price)}</option>`).join('')}</select> <button class="btn blue" onclick="addCart()">＋ Add</button><div id="cart"></div><hr><label>Discount % </label><input id="disc" type="number" value="0" min="0" max="100"><button class="btn" onclick="finish()">Complete Sale</button></div>`}function addCart(){let id=+document.getElementById('sp').value;if(!id)return;let p=d.products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.qty)return alert('Not enough stock');x.qty++}else cart.push({id,qty:1});document.getElementById('cart').innerHTML=cart.map(x=>{let p=d.products.find(y=>y.id===x.id);return `<p>${p.name} × ${x.qty} — ${money(p.price*x.qty)}</p>`}).join('')}function finish(){if(!cart.length)return alert('Add a product');let sub=0;for(let x of cart){let p=d.products.find(y=>y.id===x.id);if(x.qty>p.qty)return alert('Not enough stock');p.qty-=x.qty;sub+=p.price*x.qty}let dis=Math.min(100,+document.getElementById('disc').value||0),total=sub*(1-dis/100);d.sales.push({invoice:'INV-'+String(Date.now()).slice(-7),customer:document.getElementById('cust').value,total,date:new Date().toISOString(),items:cart});save();render('dashboard');alert('Invoice created')}function customers(a){a.innerHTML=`<div class="top"><h1>Customers</h1><button class="btn blue" onclick="addCustomer()">＋ Add Customer</button></div><div class="panel"><table class="table"><tr><th>Name</th><th>Phone</th><th>Due</th></tr>${d.customers.map(x=>`<tr><td>${x.name}</td><td>${x.phone||'-'}</td><td>${money(x.due)}</td></tr>`).join('')}</table></div>`}function addCustomer(){let name=prompt('Customer name');if(!name)return;d.customers.push({name,phone:prompt('Phone')||'',due:0});save();render('customers')}function expenses(a){a.innerHTML=`<div class="top"><h1>Expenses</h1><button class="btn blue" onclick="addExpense()">＋ Add Expense</button></div><div class="panel"><table class="table"><tr><th>Expense</th><th>Amount</th></tr>${d.expenses.map(x=>`<tr><td>${x.name}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`}function addExpense(){let name=prompt('Expense name');if(!name)return;d.expenses.push({name,amount:+prompt('Amount ₹')||0});save();render('expenses')}function reports(a){a.innerHTML=`<div class="top"><h1>Reports</h1></div><div class="cards"><div class="card"><div class="label">Sales</div><div class="value">${money(saleTotal())}</div></div><div class="card"><div class="label">Pairs</div><div class="value">${pairs()}</div></div><div class="card"><div class="label">Expenses</div><div class="value">${money(d.expenses.reduce((a,x)=>a+x.amount,0))}</div></div><div class="card"><div class="label">Products</div><div class="value">${d.products.length}</div></div></div>`}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render();</script></body></html>
